image: oven/bun:latest

stages:
  - lint
  - test
  - build

lint:
  stage: lint
  script:
    - bun x tsc --noEmit
  allow_failure: true

test:
  stage: test
  script:
    - bun test
  allow_failure: true

build:
  stage: build
  script:
    - bun run build
    - echo "Build completed - no publish stage configured yet"
